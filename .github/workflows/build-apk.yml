name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK path
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          # Runner already has SDK at /usr/local/lib/android/sdk
          ls -la $ANDROID_HOME || ls -la /usr/local/lib/android/sdk || true
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV

      - name: Accept licenses & install packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$PATH"
          # Find sdkmanager
          SM=$(find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SM"
          if [ -n "$SM" ]; then
            yes | $SM --licenses >/tmp/licenses.log 2>&1 || true
            $SM "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/tmp/sdkinstall.log 2>&1 || true
            tail -20 /tmp/licenses.log || true
          else
            echo "sdkmanager not found, relying on preinstalled packages"
            ls $ANDROID_HOME/platforms || true
            ls $ANDROID_HOME/build-tools || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List output
        if: always()
        run: find app/build/outputs -type f 2>/dev/null || echo "No outputs yet"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeadlessBridge-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
